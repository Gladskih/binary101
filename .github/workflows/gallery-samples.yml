name: Gallery samples

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-24.04
    outputs:
      cache-hit: ${{ steps.cache.outputs.cache-hit }}
      cache-key: ${{ steps.fingerprint.outputs.key }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fingerprint sample sources and recipes
        id: fingerprint
        env:
          SAMPLE_HASH: >-
            ${{ hashFiles('.github/workflows/gallery-samples.yml',
              'scripts/build-gallery-*', 'scripts/gallery_media.py',
              'scripts/pe-disassembly-samples/**', 'samples/gallery/*.c',
              'samples/pe-disassembly/c/hello.c', 'samples/pe-disassembly/go/hello.go',
              'samples/pe-disassembly/assembly/hello-masm-x86.asm',
              'samples/pe-disassembly/csharp/**') }}
        run: echo "key=gallery-${SAMPLE_HASH:?}" >> "$GITHUB_OUTPUT"

      - name: Restore prebuilt examples
        id: cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: generated/gallery
          key: ${{ steps.fingerprint.outputs.key }}

      - name: Upload prebuilt examples for the site
        if: steps.cache.outputs.cache-hit == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gallery-samples
          path: generated/gallery
          if-no-files-found: error
          overwrite: true

  pe:
    needs: restore
    if: needs.restore.outputs.cache-hit != 'true'
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build PE examples
        shell: pwsh
        run: ./scripts/build-gallery-pe.ps1

      - name: Upload PE examples for assembly
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gallery-pe
          path: generated/gallery
          if-no-files-found: error
          overwrite: true

  build:
    needs: [restore, pe]
    if: needs.restore.outputs.cache-hit != 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download PE examples
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gallery-pe
          path: generated/gallery

      - name: Install example build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lld ffmpeg python3-reportlab

      - name: Build ELF, WebAssembly, archives and media examples
        run: /usr/bin/python3 scripts/build-gallery-linux.py

      - name: Cache the completed gallery
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: generated/gallery
          key: ${{ needs.restore.outputs.cache-key }}

      - name: Upload generated examples for the site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gallery-samples
          path: generated/gallery
          if-no-files-found: error
          overwrite: true
